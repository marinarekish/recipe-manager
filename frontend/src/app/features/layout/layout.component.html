<div class="app-layout">
  <aside class="sidebar" [class.is-open]="sidebarOpen()" aria-label="Main navigation">
    <div class="brand-header">
      <img src="/assets/icons/logo.svg" alt="Mise Logo" class="brand-logo" />
      <div class="brand-text">
        <span class="brand-title">Mise</span>
        <span class="brand-subtitle">RECIPE MANAGER</span>
      </div>
    </div>

    <nav class="nav-menu">
      <a
        routerLink="/recipes"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
        (click)="closeSidebar()"
      >
        <img src="/assets/icons/explore.png" alt="" class="nav-icon" />
        <span class="nav-label">Explore</span>
      </a>
      <a routerLink="/recipes/me" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
        <img src="/assets/icons/book.png" alt="" class="nav-icon" />
        <span class="nav-label">My Recipes</span>
      </a>
      <a routerLink="/favorites" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
        <img src="/assets/icons/heart.png" alt="" class="nav-icon" />
        <span class="nav-label">Favorites</span>
      </a>
      <a routerLink="/profile" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
        <img src="/assets/icons/user.png" alt="" class="nav-icon" />
        <span class="nav-label">Profile</span>
      </a>
    </nav>

    @if (isAdmin) {
      <div class="admin-section">
        <span class="admin-label">Admin</span>
        <a routerLink="/admin/users" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
          <img src="/assets/icons/lookup.png" alt="" class="nav-icon" />
          <span class="nav-label">Users</span>
        </a>
        <a routerLink="/admin/recipes" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
          <img src="/assets/icons/lookup.png" alt="" class="nav-icon" />
          <span class="nav-label">Recipes</span>
        </a>
        <a routerLink="/admin/lookups" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
          <img src="/assets/icons/lookup.png" alt="" class="nav-icon" />
          <span class="nav-label">Lookups</span>
        </a>
      </div>
    }

    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="avatar avatar-sm">{{ initial() }}</div>
        <div class="user-info">
          <span class="user-name">
            @if (user(); as u) {
              {{ u.firstName }} {{ u.lastName }}
            } @else {
              Guest
            }
          </span>
          @if (user()?.email) {
            <span class="user-email">{{ user()!.email }}</span>
          }
        </div>
      </div>

      <button type="button" class="logout-button" (click)="logout()">
        <img src="/assets/icons/logout.png" alt="" class="logout-icon" />
        <span>Logout</span>
      </button>
    </div>
  </aside>

  @if (sidebarOpen()) {
    <button
      type="button"
      class="sidebar-backdrop"
      aria-label="Close navigation"
      (click)="closeSidebar()"
    ></button>
  }

  <div class="mobile-topbar">
    <button
      type="button"
      class="menu-toggle"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="sidebarOpen()"
      [attr.aria-label]="sidebarOpen() ? 'Close navigation' : 'Open navigation'"
    >
      <span class="menu-bar"></span>
      <span class="menu-bar"></span>
      <span class="menu-bar"></span>
    </button>
    <span class="mobile-brand">Mise</span>
  </div>

  <main class="content">
    <router-outlet />
  </main>
</div>
