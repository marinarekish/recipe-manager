<section class="recipes-page">
  <header class="page-header">
    <h1 class="page-title">Explore</h1>
  </header>

  <app-recipe-grid
    [recipes]="recipes"
    [loading]="loading"
    [errorMessage]="errorMessage"
    [emptyMessage]="'No recipes yet.'"
    [favoriteIds]="favoriteIds"
    (favoriteToggle)="onFavoriteToggle($event)"
  />
</section>
