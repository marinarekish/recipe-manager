<section class="recipes-page">
  <header class="page-header">
    <h1>My Recipes</h1>
    <a routerLink="/recipes/new" class="create-btn">
      <span>+</span> Create a recipe
    </a>
  </header>

  <app-recipe-grid
    [recipes]="recipes"
    [loading]="loading"
    [errorMessage]="errorMessage"
    (favoriteToggle)="onFavoriteToggle($event)"
  />
</section>
