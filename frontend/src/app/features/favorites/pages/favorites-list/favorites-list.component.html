<section class="favorites-page">
  <header class="page-header">
    <h1>Favorites</h1>
  </header>

  <app-recipe-grid
    [recipes]="recipes"
    [loading]="loading"
    [errorMessage]="errorMessage"
    [emptyMessage]="'No favorites yet'"
    [favoriteIds]="favoriteIds"
    (favoriteToggle)="onFavoriteToggle($event)"
  />
</section>
